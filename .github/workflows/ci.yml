name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build & link check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Steps in one job rather than parallel jobs: each would otherwise repeat
      # the install, and every check here needs the same dependency tree.
      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Internal link check
        run: pnpm check:links

      # Reports unreviewed legal drafts. Warns on pull requests so contribution
      # is not blocked on a lawyer's availability; see scripts/check-legal.mjs.
      - name: Legal review status
        run: pnpm check:legal
